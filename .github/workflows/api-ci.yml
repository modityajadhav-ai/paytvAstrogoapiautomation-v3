name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright Chromium
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp dependency:resolve
          ./mvnw -B -ntp exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: Run tests
        env:
          VRGO_REFRESH_TOKEN: ${{ secrets.VRGO_REFRESH_TOKEN }}
          VRGO_REFRESH_TOKEN_TEST: ${{ secrets.VRGO_REFRESH_TOKEN_TEST }}
          VRGO_BEARER_TOKEN: ${{ secrets.VRGO_BEARER_TOKEN }}
          VRGO_X_API_KEY: ${{ secrets.VRGO_X_API_KEY }}
          VRGO_GUEST_BEARER_TOKEN: ${{ secrets.VRGO_GUEST_BEARER_TOKEN }}
          VRGO_AUTH_USERNAME: ${{ secrets.VRGO_AUTH_USERNAME }}
          VRGO_AUTH_PASSWORD: ${{ secrets.VRGO_AUTH_PASSWORD }}
          VRGO_WEB_BASIC_AUTH_USERNAME: ${{ secrets.VRGO_WEB_BASIC_AUTH_USERNAME }}
          VRGO_WEB_BASIC_AUTH_PASSWORD: ${{ secrets.VRGO_WEB_BASIC_AUTH_PASSWORD }}
        run: |
          chmod +x mvnw
          # Skip bundled HTML report (artifact is raw allure-results; saves CI time).
          ./mvnw -B -ntp clean test -Dallure.report.skip=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: target/allure-results
