components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Subscriber or guest JWT from consumer-am token endpoint
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: VRGO API gateway key (`vrgo.x.api.key` / `VRGO_X_API_KEY`)

  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
    VrgoProfileHeaders:
      name: platform
      in: header
      description: |
        Config endpoints also accept profile headers: `environmentcode`, `language`,
        `languagecode`, `local`, `profiletype`, and `profileid`.
      schema:
        type: string

  responses:
    DataEnvelope:
      description: Standard VRGO response envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataEnvelope'

  schemas:
    DataEnvelope:
      type: object
      properties:
        data:
          description: Response payload (shape varies by endpoint)
        status:
          type: string
        message:
          type: string

    ContentRef:
      type: object
      required: [contentId, contentType]
      properties:
        contentId:
          type: string
          format: uuid
        contentType:
          type: string
          example: VOD

    SubscriberContinueWatchRequest:
      type: object
      required: [contentId, contentType, watchDuration, subscriberId]
      properties:
        contentId:
          type: string
          format: uuid
        contentType:
          type: string
          example: VOD
        watchDuration:
          type: integer
          description: Watch progress in seconds
        subscriberId:
          type: string
        groupKey:
          type: string
          description: Required for linear/CDVR events (e.g. channel-day eventId)

    LearnActionRequest:
      type: object
      required: [contentId, contentType, sessionDuration, lastPosition, refUseCase, primaryGenre]
      properties:
        contentId:
          type: string
        contentType:
          type: string
        sessionDuration:
          type: integer
        lastPosition:
          type: integer
        refUseCase:
          type: string
          example: uiredirect/default
        primaryGenre:
          type: string
          example: Entertainment

    CtgTokenRequest:
      type: object
      required: [contentType, contentId, sessionInfo]
      properties:
        contentType:
          type: string
          example: channel
        contentId:
          type: string
          format: uuid
        sessionInfo:
          type: object
          description: Session metadata (see token-generator/session-info.json fixture)

    UwmTokenRequest:
      type: object
      required: [type, cdnList, contentType, contentId, sessionInfo]
      properties:
        type:
          type: integer
          example: 0
        cdnList:
          type: array
          items:
            type: object
        isWMAuthEnabled:
          type: boolean
        isCDNAuthEnabled:
          type: boolean
        laContentId:
          type: string
        contentType:
          type: string
        contentId:
          type: string
          format: uuid
        sessionInfo:
          type: object

    RefreshTokenRequest:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string

    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, profile_id, profile_type]
      properties:
        grant_type:
          type: string
          enum: [token-exchange]
        subject_token:
          type: string
        profile_id:
          type: string
          format: uuid
        profile_type:
          type: string
          example: ADULT

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
