openapi: 3.0.3
info:
  title: VRGO API Suite
  description: |
    OpenAPI specification derived from the API Automation V3 test suite.

    Covers all VRGO microservices exercised by the regression suite:
    subscriber-event-service, subscriber-activity-producer, content-detail-service,
    homescreen-service, homescreen-proxy, config-service, search-proxy,
    recommendation-proxy, learn-action, token-generator-service, and consumer auth.

    **Authentication**
    - Subscriber endpoints: `Authorization: Bearer <JWT>` + `x-api-key`
    - Guest endpoints (`/pub/` routes on search-proxy): guest JWT + guest header overrides
    - OAuth token refresh/exchange: separate auth host (`vrgo.auth.token.url`)

    **Common VRGO headers** (applied by all clients via `vrgo.header.*` properties):
    `platform`, `profileid`, `profiletype`, `device_id`, `cp_id`, `entitlementhash`,
    `entitlements`, `entitlementvalues`, `ottbouquetid`, `environmentcode`, `language`,
    `languagecode`, `local`, `catalogueids`, `contenttype`, `isentitlementenabled`,
    `tenant_identifier`, `session_id`, and browser CORS headers.

    Response envelopes typically follow `{ "data": ..., "status": ..., "message": ... }`.
    Schemas below reflect request bodies used in tests; response schemas are indicative.
  version: 1.0.0
  contact:
    name: VRGO API Automation Team

servers:
  - url: https://api.vrgo.test.xp.irdeto.com
    description: Test
  - url: https://api.vrgo.dev.xp.irdeto.com
    description: Dev
  - url: https://api.vrgo.astro.stage.xp.irdeto.com
    description: Stage
  - url: https://api.vrptv.astro.stage.xp.irdeto.com
    description: Stage 2
  - url: https://api.vrgo.load.xp.irdeto.com
    description: Load
  - url: https://api.vrptv.ctrp.astro.com.my
    description: Production

tags:
  - name: Auth
    description: Consumer access-management OAuth (separate host per environment)
  - name: Subscriber Event Service
    description: Continue watch, watch again, favourites, locked channels, search history, last tuned channel
  - name: Subscriber Activity Producer
    description: Write continue-watch progress events
  - name: Content Detail Service
    description: VOD, series, boxset, channel, EPG, and mybox content metadata
  - name: Homescreen Service
    description: Menu, rails, footers, purchased content
  - name: Homescreen Proxy
    description: DRP rail hierarchy proxy
  - name: Config Service
    description: Platform, operator, image configs and avatars
  - name: Search Proxy
    description: Global search, suggester, usecase search (subscriber and guest)
  - name: Recommendation Proxy
    description: Content and rail recommendations by usecase
  - name: Learn Action
    description: User interaction / learning events
  - name: Token Generator Service
    description: CTG and UWM playback tokens

security:
  - bearerAuth: []
    apiKey: []

paths:
  # ── Auth (consumer-am host — use auth server URL, not API gateway) ──────────
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Refresh or exchange OAuth token
      description: |
        Hosted on the consumer access-management host (`vrgo.auth.token.url`), not the API gateway.
        Supports `grant_type=refresh_token` and `grant_type=token-exchange`.
      servers:
        - url: https://consumer-am.test.xp.irdeto.com
          description: Test auth host
        - url: https://consumer-am.dev.xp.irdeto.com
          description: Dev auth host
        - url: https://consumer-am.ctrp-stag.stgbpkastro.com
          description: Stage auth host
        - url: https://astro-consumer-am.int.xp.irdeto.com
          description: Load auth host
        - url: https://consumer-am.ctrp.astro.com.my
          description: Production auth host
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RefreshTokenRequest'
                - $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  # ── Subscriber Event Service ───────────────────────────────────────────────
  /subscriber-event-service/v3/continue-watch/continue:
    get:
      tags: [Subscriber Event Service]
      summary: Get continue-watch list
      operationId: getContinueWatch
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: isEntitlementEnabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/continue-watch/content/recent:
    get:
      tags: [Subscriber Event Service]
      summary: Get most recently watched content
      operationId: getContinueWatchRecent
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            type: string
            example: VOD
        - name: region
          in: query
          required: true
          schema:
            type: string
            example: Malaysia
        - name: contentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/continue-watch/content/recent/{seriesId}:
    get:
      tags: [Subscriber Event Service]
      summary: Get recent episode for a series
      operationId: getContinueWatchRecentBySeries
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: contentType
          in: query
          required: true
          schema:
            type: string
        - name: region
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/continue-watch/contents/progress:
    post:
      tags: [Subscriber Event Service]
      summary: Get watch progress for multiple contents
      operationId: postContinueWatchContentsProgress
      parameters:
        - name: region
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              description: Map of contentId to contentType
              example:
                a8d30db2-a55f-cc9b-b250-fa6b5d0e889c: VOD
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/cw/v3/progress:
    post:
      tags: [Subscriber Event Service]
      summary: Get CW progress with filters
      operationId: postCwProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    type: object
              example:
                filters: []
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/continue-watch/content/boxset/{boxsetId}:
    get:
      tags: [Subscriber Event Service]
      summary: Get continue-watch content for a boxset
      operationId: getContinueWatchBoxsetContent
      parameters:
        - name: boxsetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/continue-watch/:
    delete:
      tags: [Subscriber Event Service]
      summary: Remove content from continue-watch
      operationId: deleteContinueWatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRef'
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/watch-again:
    get:
      tags: [Subscriber Event Service]
      summary: Get watch-again list
      operationId: getWatchAgain
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: contentType
          in: query
          schema:
            type: string
            example: VOD
        - name: isEntitlementEnabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/favourites:
    get:
      tags: [Subscriber Event Service]
      summary: Get favourites / watchlist
      operationId: getFavourites
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: contentTypes
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: isEntitlementEnabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'
    post:
      tags: [Subscriber Event Service]
      summary: Add content to favourites
      operationId: addFavourite
      parameters:
        - name: region
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRef'
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/favourites/channels:
    get:
      tags: [Subscriber Event Service]
      summary: Get favourite channels
      operationId: getFavouriteChannels
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/favourites/{contentId}:
    delete:
      tags: [Subscriber Event Service]
      summary: Remove content from favourites
      operationId: deleteFavourite
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/locked/channels:
    get:
      tags: [Subscriber Event Service]
      summary: Get locked channels
      operationId: getLockedChannels
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'
    post:
      tags: [Subscriber Event Service]
      summary: Lock a channel
      operationId: lockChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/locked/channels/{channelCode}/status:
    get:
      tags: [Subscriber Event Service]
      summary: Get lock status for a channel
      operationId: getLockedChannelStatus
      parameters:
        - name: channelCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v3/locked/channels/{channelId}:
    delete:
      tags: [Subscriber Event Service]
      summary: Unlock a channel
      operationId: unlockChannel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v1/search-history:
    get:
      tags: [Subscriber Event Service]
      summary: Get search history
      operationId: getSearchHistory
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'
    post:
      tags: [Subscriber Event Service]
      summary: Add search query to history
      operationId: addSearchHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchQuery]
              properties:
                searchQuery:
                  type: string
                  example: TITANIC
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'
    delete:
      tags: [Subscriber Event Service]
      summary: Clear all search history
      operationId: clearSearchHistory
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/v1/search-history/{keyword}:
    delete:
      tags: [Subscriber Event Service]
      summary: Delete a search history entry
      operationId: deleteSearchHistoryKeyword
      parameters:
        - name: keyword
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: {}
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/last-tuned-channel:
    get:
      tags: [Subscriber Event Service]
      summary: Get last tuned channel
      operationId: getLastTunedChannel
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'
    post:
      tags: [Subscriber Event Service]
      summary: Set last tuned channel
      operationId: setLastTunedChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /subscriber-event-service/last-tuned-channel/{channelId}:
    delete:
      tags: [Subscriber Event Service]
      summary: Remove last tuned channel entry
      operationId: deleteLastTunedChannel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  # ── Subscriber Activity Producer ───────────────────────────────────────────
  /subscriber-activity-producer/v3/subscriber-continue-watch:
    post:
      tags: [Subscriber Activity Producer]
      summary: Record continue-watch progress
      operationId: postSubscriberContinueWatch
      parameters:
        - name: hasCompletedPlayBack
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberContinueWatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  # ── Content Detail Service ─────────────────────────────────────────────────
  /content-detail-service/pub/v1/series/{seriesId}:
    get:
      tags: [Content Detail Service]
      summary: Get series detail
      operationId: getSeries
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region
          in: query
          schema:
            type: string
        - name: contentType
          in: query
          schema:
            type: string
            example: VOD
        - name: isEntitlementEnabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/season_episode/{seasonId}:
    get:
      tags: [Content Detail Service]
      summary: Get episodes for a season
      operationId: getSeasonEpisodes
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/series_episode/{seriesId}:
    get:
      tags: [Content Detail Service]
      summary: Get episodes for a series
      operationId: getSeriesEpisodes
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/series/{seriesId}/episode/{episodeId}:
    get:
      tags: [Content Detail Service]
      summary: Get series episode view-all
      operationId: getSeriesEpisodeViewAll
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
        - name: isOpenSeries
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/tv_show/{episodeId}:
    get:
      tags: [Content Detail Service]
      summary: Get TV show episode detail
      operationId: getTvShow
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/episode/{episodeId}/{direction}:
    get:
      tags: [Content Detail Service]
      summary: Get next/previous episode (binge watch)
      operationId: getEpisodeNeighbor
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: direction
          in: path
          required: true
          schema:
            type: string
            enum: [NEXT, PREVIOUS]
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/episode-hierarchy/{episodeId}/{direction}:
    get:
      tags: [Content Detail Service]
      summary: Get episode hierarchy neighbor
      operationId: getEpisodeHierarchy
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: direction
          in: path
          required: true
          schema:
            type: string
            enum: [NEXT, CURRENT, PREVIOUS]
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/3PPVODMovie/{contentId}:
    get:
      tags: [Content Detail Service]
      summary: Get 3PP VOD movie detail
      operationId: get3ppVodMovie
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/3PPVODEpisode/{contentId}:
    get:
      tags: [Content Detail Service]
      summary: Get 3PP VOD episode detail
      operationId: get3ppVodEpisode
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/3PPVODSeason/{contentId}:
    get:
      tags: [Content Detail Service]
      summary: Get 3PP VOD season detail
      operationId: get3ppVodSeason
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/movie/{movieId}:
    get:
      tags: [Content Detail Service]
      summary: Get movie detail
      operationId: getMovie
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/boxset/{boxsetId}:
    get:
      tags: [Content Detail Service]
      summary: Get boxset detail
      operationId: getBoxset
      parameters:
        - name: boxsetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/boxset/{boxsetId}/binge:
    get:
      tags: [Content Detail Service]
      summary: Get boxset binge metadata
      operationId: getBoxsetBinge
      parameters:
        - name: boxsetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/boxset/childs:
    get:
      tags: [Content Detail Service]
      summary: Get boxset child contents
      operationId: getBoxsetChilds
      parameters:
        - name: boxsetid
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: fromMovie
          in: query
          schema:
            type: integer
        - name: pageSizeMovie
          in: query
          schema:
            type: integer
        - name: fromTvShow
          in: query
          schema:
            type: integer
        - name: pageSizeTvShow
          in: query
          schema:
            type: integer
        - name: fromTrailer
          in: query
          schema:
            type: integer
        - name: pageSizeTrailer
          in: query
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/trailer/{contentType}/{contentId}:
    get:
      tags: [Content Detail Service]
      summary: Get trailer for content
      operationId: getTrailer
      parameters:
        - name: contentType
          in: path
          required: true
          schema:
            type: string
        - name: contentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/channel/{channelId}:
    get:
      tags: [Content Detail Service]
      summary: Get channel detail
      operationId: getChannel
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/on-air/{channelId}:
    get:
      tags: [Content Detail Service]
      summary: Get on-air programme for channel
      operationId: getOnAir
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/channel/{channelId}/dates:
    get:
      tags: [Content Detail Service]
      summary: Get available EPG dates for channel
      operationId: getChannelDates
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/events/{displayDate}:
    get:
      tags: [Content Detail Service]
      summary: Get EPG events for display date
      operationId: getEvents
      parameters:
        - name: displayDate
          in: path
          required: true
          schema:
            type: string
        - name: channelids
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/channel-day/{channelId}/{dayEpochMs}:
    get:
      tags: [Content Detail Service]
      summary: Get channel day EPG
      operationId: getChannelDay
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dayEpochMs
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/DataEnvelope'

  /content-detail-service/pub/v1/channel-day/48-hours/{channelId}/{dayEpochMs}:
    get:
      tags: [Content Detail Service]
      summary: Get 48-hour channel day EPG
      operationId: getChannelDay48Hours
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
