# Daily API regression at 7:00 AM IST (01:30 UTC).
# GitHub Actions cron uses UTC — adjust the schedule below for your timezone:
#   IST  (UTC+5:30) 7:00 AM → 30 1 * * *
#   UTC             7:00 AM → 0 7 * * *
#   MYT  (UTC+8)    7:00 AM → 0 23 * * *  (previous calendar day in UTC)
name: API Daily Regression

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Maven profile / env (test, dev, stage, load, prod)'
        required: false
        default: test
        type: choice
        options:
          - test
          - dev
          - stage
          - load
          - prod

jobs:
  daily-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then ENV="test"; fi
          echo "value=$ENV" >> "$GITHUB_OUTPUT"

      - name: Run API tests
        env:
          VRGO_BEARER_TOKEN: ${{ secrets.VRGO_BEARER_TOKEN }}
          VRGO_X_API_KEY: ${{ secrets.VRGO_X_API_KEY }}
          VRGO_GUEST_BEARER_TOKEN: ${{ secrets.VRGO_GUEST_BEARER_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean test -P${{ steps.env.outputs.value }} -Dallure.report.skip=true

      - name: Build email summary
        if: always()
        id: summary
        run: |
          REPORTS="target/surefire-reports"
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0
          if [ -d "$REPORTS" ]; then
            for f in "$REPORTS"/TEST-*.xml; do
              [ -f "$f" ] || continue
              t=$(grep -oP 'tests="\K[0-9]+' "$f" | head -1); TOTAL=$((TOTAL + ${t:-0}))
              p=$(grep -oP 'failures="\K[0-9]+' "$f" | head -1); FAILED=$((FAILED + ${p:-0}))
              e=$(grep -oP 'errors="\K[0-9]+' "$f" | head -1); FAILED=$((FAILED + ${e:-0}))
              s=$(grep -oP 'skipped="\K[0-9]+' "$f" | head -1); SKIPPED=$((SKIPPED + ${s:-0}))
            done
            PASSED=$((TOTAL - FAILED - SKIPPED))
          fi
          if [ "$FAILED" -gt 0 ]; then STATUS="FAILED"; else STATUS="PASSED"; fi
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          BODY="API Automation — Daily Report
          Environment: ${{ steps.env.outputs.value }}
          Run: #${{ github.run_number }} (${{ github.sha }})
          Date: $DATE
          Status: $STATUS

          Total:   $TOTAL
          Passed:  $PASSED
          Failed:  $FAILED
          Skipped: $SKIPPED

          Attachments: Extent HTML report and Excel summary.
          Allure raw results are stored as a workflow artifact."
          {
            echo "status=$STATUS"
            echo "total=$TOTAL"
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"
          echo "$BODY" > /tmp/email-body.txt

      - name: Locate report attachments
        if: always()
        id: attachments
        run: |
          ATTACH=""
          if [ -f target/extent-reports/ExtentReport.html ]; then
            ATTACH="target/extent-reports/ExtentReport.html"
          fi
          EXCEL=$(ls -t target/excel-reports/TestReport_*.xlsx 2>/dev/null | head -1 || true)
          if [ -n "$EXCEL" ]; then
            ATTACH="${ATTACH}${ATTACH:+,}$EXCEL"
          fi
          echo "files=$ATTACH" >> "$GITHUB_OUTPUT"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-daily-${{ github.run_number }}
          path: target/allure-results
          retention-days: 30

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [API Tests] ${{ steps.summary.outputs.status }}
            — ${{ steps.env.outputs.value }}
            — ${{ steps.summary.outputs.passed }}/${{ steps.summary.outputs.total }} passed
          to: ${{ secrets.REPORT_RECIPIENTS }}
          from: ${{ secrets.SMTP_FROM }}
          body: file:///tmp/email-body.txt
          attachments: ${{ steps.attachments.outputs.files }}
