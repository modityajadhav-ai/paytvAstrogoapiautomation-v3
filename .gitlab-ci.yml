# GitLab CI - API Automation (TestNG + Maven)
# Required CI/CD variable: VRGO_REFRESH_TOKEN (masked)
# Optional: VRGO_TEST_USERNAME, VRGO_TEST_PASSWORD, TEST_ENV

stages:
  - test

variables:
  MAVEN_OPTS: "-Xmx768m -XX:+UseSerialGC"
  TEST_ENV: "test"

api_tests:
  stage: test
  image: eclipse-temurin:17-jdk

  before_script:
    - chmod +x mvnw

  script:
    - echo "Running API suite on profile ${TEST_ENV}"
    - ./mvnw -B -ntp clean test -P${TEST_ENV} -Dallure.report.skip=true

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - target/allure-results/
      - target/extent-reports/
      - target/excel-reports/
      - target/surefire-reports/

  only:
    - main
    - merge_requests
    - schedules
    - web
